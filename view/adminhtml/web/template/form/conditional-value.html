<!-- ko if: $data -->
<fieldset class="admin__fieldset" data-bind="disable: $parent.disabled">
    <legend data-bind="i18n: 'When conditions match'"></legend>
    <label>
        <span data-bind="i18n: 'Match'"></span>
        <select class="admin__control-select" data-bind="value: aggregator">
            <option value="all" data-bind="i18n: 'All conditions'"></option>
            <option value="any" data-bind="i18n: 'Any condition'"></option>
        </select>
    </label>
    <div data-bind="foreach: conditions">
        <fieldset class="admin__fieldset">
            <label>
                <span data-bind="i18n: 'Condition attribute'"></span>
                <select class="admin__control-select" data-bind="options: attributes, optionsText: 'label', optionsValue: 'value', optionsCaption: chooseAttribute, value: attribute, valueAllowUnset: true"></select>
            </label>
            <label>
                <span data-bind="i18n: 'Operator'"></span>
                <select class="admin__control-select" data-bind="options: operators, optionsText: 'label', optionsValue: 'value', value: operator, valueAllowUnset: true"></select>
            </label>
            <!-- ko if: operator() !== '<=>' -->
            <label>
                <span data-bind="i18n: 'Condition value'"></span>
                <!-- ko if: useSelect -->
                <select class="admin__control-select" data-bind="options: options, optionsText: 'label', optionsValue: 'value', optionsCaption: chooseValue, value: value, valueAllowUnset: true"></select>
                <!-- /ko -->
                <!-- ko ifnot: useSelect -->
                <input class="admin__control-text" type="text" data-bind="value: value, valueUpdate: 'input'">
                <!-- /ko -->
            </label>
            <!-- /ko -->
            <button class="action-delete" type="button" data-bind="click: $parent.removeCondition, i18n: 'Remove condition'"></button>
        </fieldset>
    </div>
    <button class="action-add" type="button" data-bind="click: addCondition, disable: conditions().length >= 50, i18n: 'Add condition'"></button>
    <p class="admin__field-note" data-bind="i18n: 'For lists, enter comma-separated option IDs or values. For dates, use YYYY-MM-DD. Enable Use for Promo Rule Conditions on custom attributes to list them here.'"></p>
    <fieldset class="admin__fieldset">
        <legend data-bind="i18n: 'If matching'"></legend>
        <div data-bind="template: {name: 'MageOS_ShoppingFeed/form/conditional-output', data: ifTrue}"></div>
    </fieldset>
    <fieldset class="admin__fieldset">
        <legend data-bind="i18n: 'Otherwise'"></legend>
        <div data-bind="template: {name: 'MageOS_ShoppingFeed/form/conditional-output', data: ifFalse}"></div>
    </fieldset>
</fieldset>
<!-- /ko -->
